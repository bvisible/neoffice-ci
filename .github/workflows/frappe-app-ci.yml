# Reusable CI for a Frappe app of the fleet: bench init against OUR frappe fork
# (version-15 — what the fleet actually runs), install the declared dependencies,
# then the caller's app at the pushed SHA, BUILD it (an app whose assets do not
# build must never reach version-15: "code neuf, paquet ancien" already bit us),
# and run its test suite. Success or failure, the last step reports to the hub,
# which owns the tracker token: a red run opens/updates the repo's [CI] issue,
# the next green run closes it with the run URL as the proof.
#
# Callers (app repos) use:
#   uses: bvisible/neoffice-devops/.github/workflows/frappe-app-ci.yml@main
#   with: { app: <package_name>, install_apps: "erpnext" }
#   secrets: { CI_REPORT_SECRET: ${{ secrets.CI_REPORT_SECRET }} }
name: Frappe App CI

on:
  workflow_call:
    inputs:
      app:
        description: "Python package name of the app under test (e.g. neoffice_theme)"
        required: true
        type: string
      install_apps:
        description: "Comma-separated dependency apps to install first, cloned from the bvisible forks (e.g. erpnext)"
        required: false
        type: string
        default: ""
      python-version:
        required: false
        type: string
        default: "3.12"
      test_args:
        description: "Extra args appended to bench run-tests (debug switch, e.g. --verbose)"
        required: false
        type: string
        default: ""
      app_ref:
        description: "Git ref of the app to test instead of the calling sha (a PR branch tested from version-15's workflow file)"
        type: string
        required: false
        default: ""
      pytest_blocking:
        description: "Make the pytest pass gate the job (default: informative only). Flip it once the pytest suites are hardened (#104)."
        required: false
        type: boolean
        default: false
      pytest_paths:
        description: "App-relative test paths to ALSO run under pytest (informative, non-blocking) — for suites the frappe runner cannot discover (module-level test functions)"
        required: false
        type: string
        default: ""
      upstream_preview:
        description: "Bench-init on UPSTREAM frappe/frappe + frappe/erpnext (version-15) instead of our forks — measures what the pending fork upgrade will cost (tracker #138). Reports to a separate [CI amont] issue."
        required: false
        type: boolean
        default: false
      skip_build:
        description: "Commit-the-build SPA forks (pos_next, raven, wiki, helpdesk, crm, mint, builder…): their assets are committed, never built on instances — get-app with --skip-assets and no blocking build step. NB: bench still runs `yarn install` on a root package.json, so a root devDependency that needs a newer Node also needs node_version."
        required: false
        type: boolean
        default: false
      build_frappe_assets:
        description: "Run `bench build --app frappe` before the tests. The bench is initialised with --skip-assets, so it has no sites/assets/assets.json; frappe's bundled_asset() reads that manifest without a guard, and any render of a frappe web template (a 404, an error page) then dies on \"'NoneType' object has no attribute 'get'\". Set it for a suite that renders web pages — builder's page tests assert the 404 of an unpublished page. The fleet never hits it: the update pipeline builds frappe on every instance at every update."
        required: false
        type: boolean
        default: false
      erpnext_bootstrap:
        description: "Run erpnext's own before_tests (setup wizard, test company) after the install. Default true; set false for an app whose own before_tests hook already completes the setup — hrms — or the two bootstraps fight over the default company."
        required: false
        type: boolean
        default: true
      node_version:
        description: "Node.js for the runner. Default 22 = what the fleet runs (osiris, 2026-09-03); frappe v15 supports it, and lms/suite root package.json demand >=22 (bench yarn-installs a root package.json even with --skip-assets). 18 was a CI-only relic."
        required: false
        type: string
        default: "22"
      tests_timeout_minutes:
        description: "Ceiling of the build + tests job. 45 fits most apps; an app whose whole suite runs longer asks for more (pos_next: about 25 minutes of tests on a quick runner, over 41 on a slow one, cancelled at 45 on 2026-11-04)."
        required: false
        type: number
        default: 45
      parallel_runner:
        description: >-
          Run the suite with `bench run-parallel-tests --total-builds 1` instead of `run-tests --app`.
          Same discovery, same tests, ONE difference that matters on a big suite: the parallel runner
          isolates each test FILE — it re-asserts frappe.session.user = Administrator and it creates the
          file's test records with commit=True. `run-tests --app` does neither: it builds every test
          record of the app in ONE uncommitted transaction, and frappe's make_test_objects() calls
          frappe.db.rollback() the moment a record already exists — which throws away every record
          created before it (hrms lost Employee _T-Employee-00002 and Shift Type "Day Shift" that way);
          and a test that ends on frappe.set_user("someone@example.com") leaks that user into the
          setUpClass of the NEXT file (hrms: PermissionError on create_company). Upstream hrms is only
          ever validated under the parallel runner (`--total-builds 2` in frappe/hrms ci.yml), so this
          is its designed mode, not a relaxation. Needs `<app>/tests/__init__.py` (the runner imports
          `<app>.tests` for global_test_dependencies) and ignores `no_tests` module flags.
        required: false
        type: boolean
        default: false
    secrets:
      CI_REPORT_SECRET:
        required: true
      FLEET_READ_TOKEN:
        description: "Read token for the PRIVATE bvisible dependency repos (neoffice_theme, erpnextswiss, nora…): a runner has no rights on another private repo. Callers pass `secrets: inherit`."
        required: false
      CLIENT_NAME_PATTERNS:
        description: "One regex per line, the client names a public repo must never carry. Declared here because a list of client names inside this PUBLIC repository would itself be the leak: it lives in a secret, and without it only the structural half runs (instance ids, client subdomains). Callers pass `secrets: inherit`."
        required: false

jobs:
  # A public repository is read, indexed and forked by anyone, and a client name in
  # it is a leak that no later edit takes back out of the history. A sweep on
  # 2026-09-10 found 34 such lines across 8 public repos -- payment incidents with
  # amounts and dates, a test asserting on a client's company name, two verbatim
  # quotes from a client conversation -- and two of them had been written that very
  # morning, after a cleanup pass. A rule in a CLAUDE.md does not check itself.
  #
  # Cheap (no bench, no services) and it runs on every event, including the ones the
  # gate below skips: the point is to catch the line before it is indexed.
  # The name half needs the CLIENT_NAME_PATTERNS secret -- a list of client names
  # inside a PUBLIC repo would itself be the leak. Without it the structural half
  # still runs, and the log says so.
  client-names:
    # PUBLIC repos only. The private ones -- neoffice-theme, nora, erpnextswiss,
    # the tracker itself -- name clients on purpose: that is what a private repo
    # is for, and a guard that fought it there would be turned off everywhere.
    # Measured the hard way on 2026-09-10: the first run of this job failed on
    # neoffice_theme, which is private and legitimately full of client names.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # Ten minutes, not three: a full-history checkout of a large repository alone can take
    # most of three (a webshop pull request was cancelled at the limit, #720).
    timeout-minutes: 10
    name: no client names (${{ inputs.app }})
    steps:
      - uses: actions/checkout@v4
        with:
          # Only a push has a range to look at (`git cat-file -e $BEFORE` and the two-dot diff
          # below, which need the commits behind the push). Every other event scans the whole
          # tree with `git ls-files` and reads no history, so it fetches none (#720).
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}

      - name: Fetch the guard
        run: |
          curl -sfL -o /tmp/check_client_names.py \
            https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/check_client_names.py

      - name: Does this change name a client?
        env:
          CLIENT_NAME_PATTERNS: ${{ secrets.CLIENT_NAME_PATTERNS }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A push carries what came before it; anything else (a PR, a schedule, the
          # first push of a branch) is checked whole rather than skipped -- a guard
          # that cannot work out a range must not decide there is nothing to see.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            export DIFF_BASE="$BEFORE"
            python3 /tmp/check_client_names.py
          else
            git ls-files | xargs -r python3 /tmp/check_client_names.py
          fi

  # An upstream preview is only worth its answer while it runs the SAME thing as
  # the normal CI. See scripts/mirror_check.py for the two days this cost.
  preview-mirrors-ci:
    if: ${{ inputs.upstream_preview }}
    runs-on: ${{ vars.CI_RUNNER == 'neoffice-mini' && fromJSON('["self-hosted","linux","arm64","neoffice-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 3
    name: preview mirrors the normal CI (${{ inputs.app }})
    steps:
      - uses: actions/checkout@v4

      - name: Does the preview still run the same thing as tests.yml?
        run: |
          curl -sfL -o /tmp/mirror_check.py \
            https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/mirror_check.py
          python3 /tmp/mirror_check.py

  # What the app would owe if the whole upstream rule set were enforced on it.
  # REPORT ONLY, on purpose: only two repos have ever run these rules, each with its
  # own debt, so a blocking job would go red on nearly every app on day one -- and a
  # guard that is red everywhere is a guard someone switches off. It prints the count
  # per rule so the debt can be paid rule by rule, and the day a count reaches zero
  # that rule can move into the app's own pre-commit set. See neoffice-maintenance#329.
  semgrep-report:
    runs-on: ${{ vars.CI_RUNNER == 'neoffice-mini' && fromJSON('["self-hosted","linux","arm64","neoffice-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 8
    name: semgrep report (${{ inputs.app }})
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Rules and semgrep
        run: |
          python3 -m pip install --quiet semgrep
          git clone --depth 1 -q https://github.com/bvisible/neoffice-ci /tmp/ci-rules

      - name: What would this app owe?
        run: |
          set +e
          semgrep --metrics=off --disable-version-check --quiet --json \
                  --config /tmp/ci-rules/semgrep-rules/rules . > /tmp/sg.json
          python3 - <<'PY'
          import collections, json, os, pathlib
          d = json.load(open("/tmp/sg.json"))
          res = d.get("results", [])
          c = collections.Counter(r["check_id"].split(".")[-1] for r in res)
          sev = {r["check_id"].split(".")[-1]: r["extra"].get("severity", "?") for r in res}
          lines = [f"**{len(res)} findings**, {len(c)} of 49 rules triggered", "",
                   "| n | severity | rule |", "|---:|---|---|"]
          lines += [f"| {n} | {sev[k]} | `{k}` |" for k, n in c.most_common()]
          if not res:
              lines = ["**No finding.** The whole upstream rule set is clean on this app —",
                       "it can be enforced here, not only reported."]
          out = "\n".join(lines)
          print(out)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"## semgrep — what this app owes\n\n{out}\n")
          PY

  # `@frappe.whitelist()` opens a function to every signed-in account, a portal customer included, and checks nothing
  # else: an audit of one app confirmed some thirty defects of that one shape (#2261). An audit is too dear to run on
  # every development, this costs seconds. Only the methods this push adds or changes are judged, so the stock blocks
  # nobody until someone touches it, and the check says how to write a reason. A job of its own, and not a step of the
  # tests: a refused method says nothing about them, and the run should still give their verdict. No base to compare
  # with (a new branch, a nightly run), or a guard that cannot be fetched: it does not block.
  # See scripts/check_whitelist_permissions.py.
  whitelist-permissions:
    runs-on: ${{ vars.CI_RUNNER == 'neoffice-mini' && fromJSON('["self-hosted","linux","arm64","neoffice-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    name: a new web method asks for a right (${{ inputs.app }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref || github.sha }}

      - name: Read what this push adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) echo "no base to compare with: skipped"; exit 0 ;;
          esac
          # --deepen: a merge of upstream in the range is told by the parents of its commits, a shallow history has none.
          if ! git fetch -q --depth=1 origin "$BASE" || ! git fetch -q --deepen=300 origin "$GITHUB_SHA"; then
            echo "::warning::the base $BASE could not be fetched: the permission check is skipped"
            exit 0
          fi
          if curl -sfL -o /tmp/check_whitelist_permissions.py \
              https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/check_whitelist_permissions.py; then
            python3 /tmp/check_whitelist_permissions.py --root . --base "$BASE"
          else
            echo "::warning::the permission check could not be fetched: skipped"
          fi

  # A nightly on an app nobody touched proves nothing and costs ~12 minutes of the
  # account's Actions allowance. This gate asks the hub what was last proven green
  # and skips the heavy job when the tree has not moved since. It asks the HUB and
  # not GitHub on purpose: the callers' token is `contents: read` only, so a job
  # requesting `actions: read` is refused at startup (measured, 2026-09-05).
  # It FAILS OPEN everywhere: any doubt — no answer, no secret, no history, unparseable
  # date — runs the tests.
  #
  # A PUSH can skip too, since 11.11.2026, when every file it changed SINCE THE LAST GREEN RUN is
  # documentation or a translation catalogue (`*.md`, `docs/**`, `.claude/**`, `**/locale/*.po|pot`):
  # a sentence in a README or a hand-fixed French catalogue paid the whole suite (the theme's fifty
  # minutes), and the light-check job below reads the catalogues as Frappe compiles them instead
  # (neoffice-maintenance#2558). The range starts at the last GREEN commit the hub knows, never at
  # the push's own `before`: the callers' concurrency drops a pending run when a newer push arrives,
  # so a code commit whose run never happened, or went red, is still in the range of the next push,
  # and that push runs the suite. A skipped push reports nothing, so the last green does not move:
  # the next nightly sees new commits and runs the whole suite (the tests that read a catalogue
  # with Frappe included). A re-run, a first push, a forced push, a list the API may have cut: the
  # suite runs. See scripts/ci_light_change.py.
  gate:
    runs-on: ${{ vars.CI_RUNNER == 'neoffice-mini' && fromJSON('["self-hosted","linux","arm64","neoffice-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    name: gate (${{ inputs.app }})
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
      light: ${{ steps.decide.outputs.light }}
      po: ${{ steps.decide.outputs.po }}
    steps:
      - name: Has anything changed since the last green run?
        id: decide
        env:
          HUB: https://neoservice.neoffice.me/api/method/neoffice_devops.github.ci.last_green
          CI_SECRET: ${{ secrets.CI_REPORT_SECRET }}
          # The caller's own token, `contents: read`: enough to compare two commits of the
          # repository under test (no permission is requested, see above).
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.run_attempt }}
          # Read-only PAT already used to clone the private fork deps. Here it only
          # asks when bvisible/frappe last moved: an app whose own tree is unchanged
          # must still be re-tested when the framework under it changed, or the gate
          # would hide exactly the kind of breakage the parity backports fixed.
          FLEET_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          # A green run older than this is replayed even with no new commit, so drift
          # in the frappe/erpnext forks, the runner image or a dependency still gets
          # caught. One week: replaying every app weekly costs almost nothing.
          MAX_AGE_DAYS: '7'
        run: |
          set +e
          decide() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "reason=$2" >> "$GITHUB_OUTPUT"; echo "$2"; echo "- **$2**" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          if [ "$EVENT" != "schedule" ] && [ "$EVENT" != "push" ]; then
            decide true "event is $EVENT — always runs (only scheduled runs and documentation-only pushes can be skipped)"
          fi
          if [ "$EVENT" = "push" ] && [ "$ATTEMPT" != "1" ]; then
            decide true "re-run (attempt $ATTEMPT) — always runs"
          fi
          if [ -z "$CI_SECRET" ]; then
            decide true "no CI_REPORT_SECRET on this repo — cannot ask the hub, running"
          fi

          resp=$(curl -sS --max-time 20 -X POST "$HUB" \
                 --data-urlencode "secret=$CI_SECRET" \
                 --data-urlencode "repo=$REPO" \
                 --data-urlencode "ref=$BRANCH" 2>/dev/null)
          last_sha=$(printf '%s' "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('message',{}).get('sha',''))" 2>/dev/null)
          last_at=$(printf '%s' "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('message',{}).get('at',''))" 2>/dev/null)

          if [ -z "$last_sha" ]; then
            decide true "the hub knows no green run for $REPO@$BRANCH (or did not answer) — running"
          fi

          # A push: only documentation and catalogues since the last green commit? The light-check job then
          # stands in for the suite. Anything else, or any doubt, runs it (scripts/ci_light_change.py).
          if [ "$EVENT" = "push" ]; then
            if ! curl -sfL --retry 3 --retry-delay 5 -o /tmp/ci_light_change.py \
                https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/ci_light_change.py; then
              decide true "push: the change classifier could not be fetched — running"
            fi
            out=$(GITHUB_OUTPUT='' GITHUB_TOKEN="$GH_TOKEN" python3 /tmp/ci_light_change.py decide \
                  --repo "$REPO" --base "$last_sha" --head "$SHA" 2>&1)
            why=$(printf '%s\n' "$out" | sed -n 's/^reason=//p' | tail -1)
            if [ "$(printf '%s\n' "$out" | sed -n 's/^light=//p' | tail -1)" = "true" ]; then
              po=$(printf '%s\n' "$out" | sed -n 's/^po=//p' | tail -1)
              echo "light=true" >> "$GITHUB_OUTPUT"
              echo "po=${po:-[]}" >> "$GITHUB_OUTPUT"
              decide false "push: $why since the last green run ${last_sha:0:10} — the heavy suite is skipped, the light check stands in"
            fi
            decide true "push: ${why:-the change could not be judged} (since the last green run ${last_sha:0:10}) — running"
          fi

          if [ "$last_sha" != "$SHA" ]; then
            decide true "new commits since the last green run (${last_sha:0:10} -> ${SHA:0:10}) — running"
          fi

          last_epoch=$(date -u -d "$last_at" +%s 2>/dev/null)
          if [ -z "$last_epoch" ]; then
            decide true "could not read the date of the last green run ('$last_at') — running"
          fi
          age_days=$(( ( $(date -u +%s) - last_epoch ) / 86400 ))
          if [ "$age_days" -ge "$MAX_AGE_DAYS" ] || [ "$age_days" -lt 0 ]; then
            decide true "last green run is ${age_days}d old (floor ${MAX_AGE_DAYS}d) — replaying to catch drift"
          fi

          # The app's own tree is unchanged — but it is tested ON our frappe fork.
          # If the framework moved since the green run, this app has not been proven
          # against it. Unknown answer (no token, API down) => run.
          if [ -z "$FLEET_TOKEN" ]; then
            decide true "no FLEET_READ_TOKEN — cannot tell whether the framework moved, running"
          fi
          if true; then
            frappe_at=$(curl -sS --max-time 20 -H "Authorization: Bearer $FLEET_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        "https://api.github.com/repos/bvisible/frappe/commits/version-15" 2>/dev/null \
                        | python3 -c "import json,sys; print(json.load(sys.stdin)['commit']['committer']['date'])" 2>/dev/null)
            if [ -z "$frappe_at" ]; then
              decide true "could not read when bvisible/frappe last moved — running"
            fi
            frappe_epoch=$(date -u -d "$frappe_at" +%s 2>/dev/null)
            if [ -z "$frappe_epoch" ] || [ "$frappe_epoch" -gt "$last_epoch" ]; then
              decide true "bvisible/frappe moved on ${frappe_at:0:10}, after this app's green run — running"
            fi
          fi

          decide false "nothing changed since the green run of ${last_at:0:10} on ${SHA:0:10} (${age_days}d ago) — skipped, no minutes spent"

  # What stands in for the suite on a push of documentation and catalogues only (the gate above). A catalogue
  # is read the way `bench compile-po-to-mo` reads it — Babel's lenient `read_po`, then `write_mo` — and not
  # with `msgfmt --check`, which refuses entries Frappe has served for months (two in erpnextswiss). Babel is
  # pinned as our frappe fork pins it. It reports nothing to the hub: it says nothing about the code.
  light-check:
    needs: gate
    if: ${{ needs.gate.outputs.light == 'true' }}
    runs-on: ${{ vars.CI_RUNNER == 'neoffice-mini' && fromJSON('["self-hosted","linux","arm64","neoffice-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    name: documentation and translations only — light check (${{ inputs.app }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref || github.sha }}

      - name: The changed catalogues read as Frappe reads them
        env:
          PO: ${{ needs.gate.outputs.po }}
        run: |
          printf '%s' "$PO" | python3 -c 'import json, sys; sys.stdout.write("".join(p + "\n" for p in json.load(sys.stdin) or []))' > /tmp/catalogues.txt
          if [ ! -s /tmp/catalogues.txt ]; then
            echo "no catalogue changed: documentation only, nothing to read"
            exit 0
          fi
          curl -sfL --retry 3 --retry-delay 5 -o /tmp/check_po_reads.py \
            https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/check_po_reads.py
          python3 -m pip install --quiet "Babel~=2.18.0" || python3 -m pip install --quiet "Babel~=2.18.0"
          set --
          while IFS= read -r po; do set -- "$@" "$po"; done < /tmp/catalogues.txt
          python3 /tmp/check_po_reads.py "$@"

  tests:
    needs: gate
    # Fail open here too: only an EXPLICIT 'false' skips. A gate that errored, timed
    # out or returned nothing leaves the output empty, and the tests run — losing a
    # nightly silently would be worse than the minutes it saves.
    # On our CI machine instead when the repository's variable CI_RUNNER is neoffice-mini: `tests-mini` below.
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && vars.CI_RUNNER != 'neoffice-mini' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.tests_timeout_minutes }}
    name: build + tests (${{ inputs.app }})

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone app under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Test modules that break the run for everyone (static, seconds)
        # A module-level pytest skip kills the Frappe unittest run at collection: not one test runs (an error here,
        # before ten minutes of bench). A `patch.object(frappe.local, <attribute>, create=True)` deletes the attribute
        # for the rest of the run (a warning: some apps still carry it on attributes that fail nothing yet). Both cost
        # a red Tests run on 02.10; see scripts/check_test_hygiene.py. A guard that cannot be fetched must not block.
        run: |
          if curl -sfL -o /tmp/check_test_hygiene.py \
              https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/check_test_hygiene.py; then
            python3 /tmp/check_test_hygiene.py --root .
          else
            echo "::warning::the test hygiene check could not be fetched: skipped"
          fi

      - name: A new test does not act as Administrator (static, seconds)
        # Administrator is our account and no check ever refuses it: a test that plays the act under it says nothing
        # about a real user (a customer who could no longer pay went through thousands of green tests, #2114). Only
        # what this push adds is judged, so the suites that exist are not all red at once; the check says how to
        # write the exception. See scripts/check_test_roles.py (and the tool: frappe/tests/roles.py of our fork).
        # No base to compare with (a new branch, a nightly run), or a guard that cannot be fetched: it does not block.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) echo "no base to compare with: skipped"; exit 0 ;;
          esac
          # --deepen: a merge of upstream in the range is told by the parents of its commits, a shallow history has none.
          if ! git fetch -q --depth=1 origin "$BASE" || ! git fetch -q --deepen=300 origin "$GITHUB_SHA"; then
            echo "::warning::the base $BASE could not be fetched: the role check is skipped"
            exit 0
          fi
          if curl -sfL -o /tmp/check_test_roles.py \
              https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/check_test_roles.py; then
            python3 /tmp/check_test_roles.py --root . --base "$BASE"
          else
            echo "::warning::the role check could not be fetched: skipped"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ inputs.app }}-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ inputs.app }}-
            ${{ runner.os }}-pip-

      - name: Retry helper (a registry that answers 5xx for a minute is not a verdict on our code)
        # `bench init` and `bench get-app` download from GitHub, PyPI and the yarn registry. On 2026-10-09 the registry
        # answered "502 Bad Gateway" to one `yarn install` and a push whose code nobody had broken went red, with its
        # issue on the tracker. scripts/ci_retry.sh gives the downloading steps three attempts (a real error fails all
        # three the same way and still fails the run). Fetched like the test hygiene check; if it cannot be fetched
        # those steps simply run once, as they did before.
        run: |
          if ! curl -sfL --retry 3 --retry-delay 5 -o ~/ci_retry.sh \
              https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/ci_retry.sh; then
            echo "::warning::the retry helper could not be fetched: the steps that download will run once"
            printf 'retry() { "$@"; }\n' > ~/ci_retry.sh
          fi

      - name: Install MariaDB client and wkhtmltopdf (patched Qt build, as frappe's own CI)
        # The apt wkhtmltopdf is the unpatched-Qt build: it ignores frappe's switches and aborts
        # on the first asset it cannot fetch ("HostNotFoundError"); the wkhtmltox release build is
        # what frappe/erpnext/hrms CIs install. Falls back to apt if the release is unreachable.
        # The runner image ships foreign apt repositories, and each one has taken the whole
        # `apt-get update` down on its own: Google Chrome's served index files that fail
        # apt's hash check ("Hash Sum mismatch", 2026-09-09, three runs in a row), then
        # Microsoft's answered "403 Forbidden ... is no longer signed" (2026-09-24, a nightly
        # run failed before any test). With the update gone goes mariadb-client, which is what
        # every later step dies on ("mariadb: command not found", exit 127). Nothing here needs
        # them: only Ubuntu's own archives are kept.
        # Then those archives went silent: on 2026-11-11 from about 13:40 UTC the runners no longer resolved
        # azure.archive.ubuntu.com, archive.ubuntu.com or security.ubuntu.com while github.com still answered, and
        # every app died here for hours, before one test ran (neoffice-maintenance#2542). Every apt call now goes
        # through scripts/ci_apt_install.sh: downloads retried, the update and the install retried, and when the
        # runner's archives do not answer, an official Ubuntu mirror that does, checked against the same keyring.
        # Fetched like the retry helper; if it cannot be fetched, apt runs once from the runner's archives, as before.
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -name '*.list' -o -name '*.sources' \) ! -name 'ubuntu*' -print -delete
          if ! curl -sfL --retry 3 --retry-delay 5 -o ~/ci_apt_install.sh \
              https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/ci_apt_install.sh; then
            echo "::warning::the apt helper could not be fetched: apt runs once, from the runner's own archives"
            printf '%s\n' 'sudo apt-get update -q && sudo apt-get install -yq "$@"' > ~/ci_apt_install.sh
          fi
          bash ~/ci_apt_install.sh mariadb-client xfonts-75dpi xfonts-base
          # The client insists on TLS and the mariadb:10.6 service container offers none, so every call died with
          # "TLS/SSL error: SSL is required, but the server does not support it": the two below, and the one
          # frappe makes itself when it restores a new site's database (neoffice-maintenance#2041). The
          # container is on the runner's own network: the client is told once, in its own configuration.
          printf '[client]\nskip-ssl\n' > ~/.my.cnf
          # The release is downloaded through `retry`, a minute at most per attempt: one failed download of it was
          # the whole nightly run of an app (09.11.2026, suite, neoffice-maintenance#2375), because the apt fallback
          # has nothing to install since `ubuntu-latest` is 26.04, whose archives no longer carry wkhtmltopdf. The
          # jammy build still installs on 26.04 (helpdesk, the same night).
          # shellcheck source=/dev/null
          . ~/ci_retry.sh
          if retry wget -q --timeout=60 --tries=2 -O /tmp/wkhtmltox.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb; then
            bash ~/ci_apt_install.sh /tmp/wkhtmltox.deb || bash ~/ci_apt_install.sh wkhtmltopdf
          else
            echo "::warning::the wkhtmltox release could not be downloaded: apt's wkhtmltopdf instead (absent from Ubuntu 26.04)"
            bash ~/ci_apt_install.sh wkhtmltopdf
          fi
          wkhtmltopdf --version

      - name: Init bench (bvisible/frappe version-15 — the fleet's frappe)
        run: |
          # shellcheck source=/dev/null
          . ~/ci_retry.sh
          retry pip install frappe-bench
          FRAPPE_PATH=https://github.com/bvisible/frappe
          if [ "${{ inputs.upstream_preview }}" = "true" ]; then
            FRAPPE_PATH=https://github.com/frappe/frappe
            echo "UPSTREAM PREVIEW: frappe from $FRAPPE_PATH (erpnext from frappe/erpnext below)"
          fi
          # A failed attempt leaves a half-built bench: each attempt starts from nothing. `bench init` is the last
          # command of the function because `set -e` is off inside a function that `retry` calls.
          init_bench() {
            rm -rf ~/frappe-bench
            bench init --skip-redis-config-generation --skip-assets \
              --frappe-path "$FRAPPE_PATH" \
              --frappe-branch version-15 \
              --python "$(which python)" ~/frappe-bench
          }
          retry init_bench
          # frappe's Dropbox integration still imports pkg_resources at install
          # time. Python 3.12 venvs ship without setuptools, and installing it
          # unpinned pulls 81.0.0 — the release that REMOVED pkg_resources — so
          # the second run died exactly like the first. Pin below 81, like the
          # fleet's own envs.
          ~/frappe-bench/env/bin/pip install --quiet "setuptools<81"
          ~/frappe-bench/env/bin/python -c "import pkg_resources; print('pkg_resources OK')"
          # The mariadb client apt installs now insists on TLS, and the mariadb:10.6 service container
          # offers none: "ERROR 2026 (HY000): TLS/SSL error: SSL is required, but the server does not
          # support it" killed this step on every app from 2026-10-30 18:22 UTC, before one test ran
          # (neoffice-maintenance#2041). The container lives on the runner's own network, nothing to protect.
          mariadb --skip-ssl --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --skip-ssl --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      # Upstream v15 lacks two things our fork adds to frappe's test package:
      # the v16 test base-class names (UnitTestCase / IntegrationTestCase) and the
      # v16 `whitelist_for_tests` helper. Both are pure ADDITIONS at the end of
      # their file, and both travel WITH us to the merge — they are not a cost of
      # the upgrade. Without them the preview died at test collection every week
      # on an ImportError, before running one line: five red [CI amont] issues a
      # Monday that said nothing about upstream, and that would have buried the
      # real signal the day it appears.
      #
      # Nothing is matched on markers or line numbers. The runner holds BOTH files,
      # so it checks that ours is literally upstream's plus a tail, and carries
      # exactly that tail. If that ever stops being true — upstream edits the file,
      # or we start modifying instead of appending — it says so and carries
      # nothing, rather than pasting a mismatched block.
      #
      # A file of ours that upstream does not have at all travels whole, for the same reason: roles.py, the people a
      # test acts as (neoffice-maintenance#2125), is imported by every app's tests.
      - name: Upstream preview — carry the tail our fork adds to frappe's tests
        if: ${{ inputs.upstream_preview == true }}
        env:
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.request

          FILES = ["frappe/tests/__init__.py", "frappe/tests/utils.py"]
          ADDED = ["frappe/tests/roles.py"]
          bench = os.path.expanduser("~/frappe-bench/apps/frappe")
          token = os.environ.get("FLEET_READ_TOKEN", "")

          def ours(rel):
              url = f"https://api.github.com/repos/bvisible/frappe/contents/{rel}?ref=version-15"
              headers = {"Accept": "application/vnd.github.raw"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(url, headers=headers)
              return urllib.request.urlopen(req, timeout=30).read().decode("utf-8")

          carried = 0
          for rel in FILES:
              target = os.path.join(bench, rel)
              theirs = open(target, encoding="utf-8").read()
              mine = ours(rel)
              base = theirs.rstrip()
              if not mine.startswith(base):
                  print(f"::warning::{rel}: our version is not upstream's plus a tail — "
                        "nothing carried, the errors below are real and need a look")
                  continue
              tail = mine[len(base):]
              if not tail.strip():
                  print(f"{rel}: no divergence to carry")
                  continue
              with open(target, "a", encoding="utf-8") as fh:
                  fh.write(tail)
              carried += len(tail)
              print(f"{rel}: carried {len(tail)} chars")
          for rel in ADDED:
              target = os.path.join(bench, rel)
              if os.path.exists(target):
                  print(f"::warning::{rel}: upstream has one now — not carried, look at both")
                  continue
              with open(target, "w", encoding="utf-8") as fh:
                  carried += fh.write(ours(rel))
              print(f"{rel}: carried whole")
          print(f"total carried onto upstream frappe: {carried} chars")
          PY

      - name: Get dependency apps
        if: inputs.install_apps != ''
        working-directory: /home/runner/frappe-bench
        run: |
          # Private bvisible deps (neoffice_theme, erpnextswiss, nora…) need a
          # token: the runner only holds rights on the repo under test.
          AUTH="https://github.com/"
          if [ -n "$FLEET_READ_TOKEN" ]; then
            AUTH="https://x-access-token:${FLEET_READ_TOKEN}@github.com/"
          fi
          # shellcheck source=/dev/null
          . ~/ci_retry.sh
          IFS=',' read -ra DEPS <<< "${{ inputs.install_apps }}"
          for dep in "${DEPS[@]}"; do
            dep="$(echo "$dep" | xargs)"
            [ -z "$dep" ] && continue
            # --overwrite: an attempt that died half way (yarn, pip) leaves apps/<dep>, and without the flag the next
            # `bench get-app` would stop to ask whether to replace it.
            if [ "${{ inputs.upstream_preview }}" = "true" ] && [ "$dep" = "erpnext" ]; then
              retry bench get-app erpnext https://github.com/frappe/erpnext --branch version-15 --overwrite
              continue
            fi
            # The repository is named with dashes or with underscores: both are tried inside ONE attempt, so the name
            # that does not exist (an immediate 404) never costs a wait.
            get_dep() {
              bench get-app "$dep" "${AUTH}bvisible/${dep//_/-}" --branch version-15 --overwrite \
                || bench get-app "$dep" "${AUTH}bvisible/${dep}" --branch version-15 --overwrite
            }
            retry get_dep
          done
        env:
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}

      - name: Get app under test
        working-directory: /home/runner/frappe-bench
        run: |
          # shellcheck source=/dev/null
          . ~/ci_retry.sh
          get_app_under_test() {
            if [ "${{ inputs.skip_build }}" = "true" ]; then
              bench get-app --overwrite --skip-assets ${{ inputs.app }} "$GITHUB_WORKSPACE" && bench setup requirements --dev
            else
              bench get-app --overwrite ${{ inputs.app }} "$GITHUB_WORKSPACE" && bench setup requirements --dev
            fi
          }
          retry get_app_under_test
          # Several fleet suites import pytest at module level (pytest-style
          # files next to unittest ones): without it in the env, frappe's
          # runner dies at collection with ModuleNotFoundError.
          retry ~/frappe-bench/env/bin/pip install --quiet pytest

      - name: New site + install
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          # A sender identity for the test site, as frappe's own CI does
          # (.github/helper/site_config.json): frappe.sendmail builds the queued mail at
          # call time and EmailAccount.default_sender dies on a None email_id when no
          # account and no auto_email_id exist (webshop test_item_review, 2026-09-03).
          # Nothing is sent in tests: email_queue gates delivery on frappe.flags.in_test.
          bench --site test_site set-config auto_email_id test@example.com
          bench --site test_site set-config mail_server smtp.example.com
          bench --site test_site set-config mail_login test@example.com
          bench --site test_site set-config mail_password test
          # frappe throttles User creation at 60/min (throttle_user_creation); hrms tests create more
          bench --site test_site set-config throttle_user_limit 1000 --parse   # --parse: an int, not the string "1000"
          # PDF rendering resolves /assets URLs against host_name; the site name is not a host
          bench --site test_site set-config host_name http://127.0.0.1:8000
          # hrms creates the "Employee Self Service" User Type, whose install
          # validates a per-type doctype limit in site config and dies without
          # it ("The limit has not set for the user type…").
          if [[ ",${{ inputs.install_apps }}," == *,hrms,* || "${{ inputs.app }}" == "hrms" ]]; then
            bench --site test_site set-config user_type_doctype_limit '{"employee_self_service": 80}' --parse
          fi
          IFS=',' read -ra DEPS <<< "${{ inputs.install_apps }}"
          for dep in "${DEPS[@]}"; do
            dep="$(echo "$dep" | xargs)"
            [ -z "$dep" ] && continue
            bench --site test_site install-app "$dep"
          done
          bench --site test_site install-app ${{ inputs.app }}

      - name: Serve exchange rates locally (the tests never wait for a rate provider)
        # erpnext.setup.utils.get_exchange_rate asks Currency Exchange Settings' provider (frankfurter)
        # for any pair no Currency Exchange record gives, with a 10 s timeout. The test site has no
        # record, so every test that needs a pair went to the internet: when the provider was slow
        # or down (4.11.2026, maintenance#2225), each such test lost 20 s, a test that times its call
        # went red (neoffice_theme test_scan_link_lock_wait), a test that needs a rate got none
        # (webshop test_exact_match_with_price, "Missing Currency Exchange Rates for INR-USD"), and the
        # opening invoices of erpnext's tests failed on something else than what they assert. A rate
        # from the network is no more a fact about our code than one from here: a local provider
        # answers fixed, plausible rates (never 1 between two currencies), in the provider's own
        # format. A test that writes its own Currency Exchange still reads it first.
        if: inputs.app == 'erpnext' || contains(inputs.install_apps, 'erpnext')
        working-directory: /home/runner/frappe-bench/sites
        run: |
          nohup python3 - >/dev/null 2>&1 <<'PY' &
          import http.server, json, socketserver, urllib.parse
          # Units of each currency for one US dollar; any other currency counts as one dollar.
          PER_USD = {"USD": 1.0, "EUR": 0.92, "CHF": 0.88, "GBP": 0.79, "INR": 83.0, "PKR": 280.0,
                     "JPY": 150.0, "CAD": 1.36, "AUD": 1.52, "CNY": 7.2, "SEK": 10.5, "NOK": 10.8, "DKK": 6.9}
          class H(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.0"
              def do_GET(self):
                  url = urllib.parse.urlsplit(self.path)
                  query = urllib.parse.parse_qs(url.query)
                  base = (query.get("base") or ["USD"])[0]
                  target = (query.get("symbols") or ["USD"])[0]
                  rate = round(PER_USD.get(target, 1.0) / PER_USD.get(base, 1.0), 6)
                  body = json.dumps({"amount": 1.0, "base": base, "date": url.path.strip("/"), "rates": {target: rate}}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          socketserver.TCPServer.allow_reuse_address = True
          socketserver.TCPServer(("127.0.0.1", 8001), H).serve_forever()
          PY
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null "http://127.0.0.1:8001/2026-01-01?base=USD&symbols=INR" && break
            sleep 0.5
          done
          ../env/bin/python - <<'PY'
          import frappe
          frappe.init(site="test_site", sites_path=".")
          frappe.connect()
          frappe.set_user("Administrator")
          settings = frappe.get_single("Currency Exchange Settings")
          settings.service_provider = "Custom"
          settings.api_endpoint = "http://127.0.0.1:8001/{transaction_date}"
          settings.set("req_params", [{"key": "base", "value": "{from_currency}"}, {"key": "symbols", "value": "{to_currency}"}])
          settings.set("result_key", [{"key": "rates"}, {"key": "{to_currency}"}])
          settings.save()
          frappe.db.commit()
          from erpnext.setup.utils import get_exchange_rate
          rate = get_exchange_rate("USD", "INR")
          print("exchange rates served on 127.0.0.1:8001, USD to INR:", rate)
          assert abs(rate - 83.0) < 1e-6, rate
          PY

      - name: Bootstrap erpnext test data
        if: contains(inputs.install_apps, 'erpnext') && inputs.erpnext_bootstrap
        working-directory: /home/runner/frappe-bench
        run: |
          # frappe's test runner only runs the before_tests hooks of the app
          # UNDER TEST, so erpnext's bootstrap (setup wizard: company, warehouse
          # types, fiscal years) never runs when testing a third-party app —
          # neoffice_theme died on "Could not find Warehouse Type: Transit".
          # hrms solves it with its own before_tests hook; we run erpnext's
          # bootstrap explicitly instead, so no app needs a hook for CI.
          bench --site test_site set-config allow_tests true
          bench --site test_site execute erpnext.setup.utils.before_tests

      - name: Build frappe assets (suites that render frappe web templates)
        if: inputs.build_frappe_assets
        working-directory: /home/runner/frappe-bench
        # `bench init --skip-assets` above leaves the bench with no
        # sites/assets/assets.json, and frappe's bundled_asset() does
        # `get_assets_json().get(path)` with no guard: rendering ANY page that
        # goes through frappe's base.html — a 404, an error page — dies on
        # "'NoneType' object has no attribute 'get'". No instance ever sees this
        # (the update pipeline builds frappe on every instance, every update), so
        # it only shows up here, and only for a suite that renders web pages.
        run: bench build --app frappe

      - name: Build (blocking — an app that does not build must not ship)
        if: inputs.skip_build != true
        working-directory: /home/runner/frappe-bench
        run: bench build --app ${{ inputs.app }}

      - name: Debug test records (test_args starts with --debug-records)
        if: startsWith(inputs.test_args, '--debug-records')
        working-directory: /home/runner/frappe-bench/sites
        env:
          # --debug-records walks every doctype of the app; --debug-records:X
          # walks only X, with a spy that prints each record before insert.
          DEBUG_SPEC: ${{ inputs.test_args }}
          APP_UNDER_TEST: ${{ inputs.app }}
        run: |
          ../env/bin/python <<'PY'
          import os
          import traceback

          import frappe
          import frappe.test_runner as tr

          frappe.init(site="test_site", sites_path=".")
          frappe.connect()
          frappe.flags.in_test = True

          spec = os.environ["DEBUG_SPEC"]
          target = spec.split(":", 1)[1] if ":" in spec else None

          orig = tr.make_test_objects

          def spy(doctype, test_records=None, verbose=None, reset=False, commit=False):
              recs = test_records if test_records is not None else frappe.get_test_records(doctype)
              print(">>>> make_test_objects %s (%d records)" % (doctype, len(recs or [])), flush=True)
              for r in recs or []:
                  keys = ("doctype", "item_code", "name", "variant_of", "has_variants", "item_name")
                  print("     rec:", {k: r.get(k) for k in keys if r.get(k) is not None}, flush=True)
              return orig(doctype, test_records=test_records, verbose=verbose, reset=reset, commit=commit)

          tr.make_test_objects = spy

          if target:
              doctypes = [target]
          else:
              mods = frappe.get_all("Module Def", {"app_name": os.environ["APP_UNDER_TEST"]}, pluck="name")
              doctypes = frappe.get_all(
                  "DocType", filters={"module": ["in", mods]}, pluck="name", order_by="name"
              )
          print("==== %d doctypes to walk" % len(doctypes), flush=True)
          for dt in doctypes:
              print("==== DT:", dt, flush=True)
              try:
                  tr.make_test_records(dt, verbose=1, commit=True)
                  tr.make_test_records_for_doctype(dt, verbose=1, commit=True)
              except Exception as exc:
                  print("!!!! FAILED at doctype:", dt, "->", type(exc).__name__, str(exc)[:300], flush=True)
                  traceback.print_exc()
                  break
          frappe.db.commit()
          PY

      - name: Serve host_name so wkhtmltopdf can fetch what a print format links
        # scrub_urls() turns every relative href/src of a print format into an absolute
        # URL on host_name — a salary slip links http://127.0.0.1:8000/print.bundle.css —
        # and wkhtmltopdf aborts the whole render on a resource it cannot reach
        # (--load-error-handling defaults to abort). frappe's get_pdf() only tolerates
        # ContentNotFoundError & co, never a network error, so `frappe.attach_print` died
        # in CI with "ConnectionRefusedError" (with host_name set) or "HostNotFoundError"
        # (without it) — 9 hrms tests. Nothing serves the site during `bench run-tests`,
        # so answer 200/empty to everything: it removes the network error without hiding
        # anything asserted — these tests check that a PDF was produced and mailed, never
        # what it looks like. An instance never hits this: nginx serves the assets.
        if: "!startsWith(inputs.test_args, '--debug-records')"
        run: |
          nohup python3 - >/dev/null 2>&1 <<'PY' &
          import http.server, socketserver
          class H(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.0"
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", "0")
                  self.end_headers()
              do_HEAD = do_GET
              def log_message(self, *a):
                  pass
          socketserver.TCPServer.allow_reuse_address = True
          socketserver.TCPServer(("127.0.0.1", 8000), H).serve_forever()
          PY
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8000/ping && break
            sleep 0.5
          done
          curl -sf -o /dev/null http://127.0.0.1:8000/ping && echo "asset stub up on 127.0.0.1:8000"

      - name: Run tests
        if: "!startsWith(inputs.test_args, '--debug-records') && !inputs.parallel_runner"
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          set -o pipefail
          # The log goes to $RUNNER_TEMP, the runner's folder for this job's files (emptied before every job), next to
          # the logs of the JavaScript and pytest suites: the report step reads them all from there (#2635).
          bench --site test_site run-tests --app ${{ inputs.app }} ${{ inputs.test_args }} 2>&1 | tee "$RUNNER_TEMP/test-output.log"
        env:
          TYPE: server
          CI: "Yes"

      - name: Run tests (parallel runner, one chunk — per-file isolation)
        # Same files, same tests: --total-builds 1 puts everything in one chunk.
        # What changes is isolation — see the `parallel_runner` input above. The
        # runner exits 1 on failure only when CI is set in the environment.
        if: "!startsWith(inputs.test_args, '--debug-records') && inputs.parallel_runner"
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          set -o pipefail
          bench --site test_site run-parallel-tests --app ${{ inputs.app }} \
            --total-builds 1 --build-number 1 2>&1 | tee "$RUNNER_TEMP/test-output.log"
        env:
          TYPE: server
          CI: "Yes"

      - name: Pytest (suites invisible to the frappe runner — blocking when pytest_blocking)
        if: inputs.pytest_paths != '' && !startsWith(inputs.test_args, '--debug-records')
        continue-on-error: ${{ !inputs.pytest_blocking }}
        working-directory: /home/runner/frappe-bench/sites
        run: |
          # The frappe runner only discovers unittest classes; module-level
          # test functions (pytest style) never run under it. This pass makes
          # them visible; with pytest_blocking it gates the job. The exit
          # status must survive the `tail` (pipefail), and --tb=short keeps
          # the cause of an error in the log (--tb=line hid the fixture
          # errors of #104 for four days).
          set -o pipefail
          ../env/bin/pip install --quiet pytest
          rc=0
          for p in ${{ inputs.pytest_paths }}; do
            echo "==== pytest $p"
            timeout 900 ../env/bin/python -m pytest "../apps/${{ inputs.app }}/$p" -q -p no:cacheprovider --tb=short 2>&1 | tee -a "$RUNNER_TEMP/pytest-output.log" | tail -80 || rc=1
          done
          exit $rc

      - name: JavaScript tests of the app (node --test, seconds)
        # The suites under <app>/tests/js (the desk's search bar and spaces, the assistant's cards, forms of other apps:
        # some 1 200 tests across the fleet) were run by no workflow: five of them stayed red after a change of the code
        # they test, and nobody saw it (2026-11-03). They need no bench and run from the checkout, after the server tests
        # so both verdicts are in the log; a red one fails the job, and the report below says so. An app without such a
        # folder passes at once.
        if: ${{ !cancelled() && !startsWith(inputs.test_args, '--debug-records') }}
        env:
          APP: ${{ inputs.app }}
        run: |
          shopt -s nullglob
          files=("$APP"/tests/js/*.test.js)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no JavaScript tests under $APP/tests/js"
            exit 0
          fi
          node --version
          # The log is read by the report below, which names the failing tests on the tracker issue (#2635).
          set -o pipefail
          node --test "${files[@]}" 2>&1 | tee "$RUNNER_TEMP/js-test-output.log"

      - name: Report to the fleet tracker (via the hub)
        # success() || failure() and not always(): a cancelled run (superseded
        # by concurrency) must not report — it says nothing about the code.
        # Debug walks never report either: their green says nothing about the
        # tests (a --debug-records job exits 0 even when the walk fails) — one
        # actually closed the erpnextswiss [CI] issue as "proof".
        if: (success() || failure()) && !startsWith(inputs.test_args, '--debug-records')
        env:
          CI_SECRET: ${{ secrets.CI_REPORT_SECRET }}
        run: |
          # The hub's answer is read, not discarded: a caller without
          # CI_REPORT_SECRET got 403 {"ok": false} inside a green step, and its
          # red runs reached no tracker issue (the frappe fork, until
          # 2026-09-12). A report that does not land now leaves a warning on the
          # run; it never turns it red.
          if [ -z "$CI_SECRET" ]; then
            echo "::warning title=CI report not sent::no CI_REPORT_SECRET on this repository (secrets: inherit in the caller?): this run opens and closes no tracker issue"
            exit 0
          fi
          SUMMARY=""
          if [ "${{ job.status }}" != "success" ]; then
            # What the tracker issue says: each suite's verdict and the failing tests by name, read from every log a
            # suite wrote (scripts/ci_test_summary.py, #2635). The end of the server log was the prints of the last
            # tests, written after unittest's verdict: on 2026-11-13 the theme's issue quoted test-site setup and no
            # failing test, and a red `node --test` reported the end of a green server suite. The script runs isolated
            # (-I) and without the report's secret in its environment. It never decides the report: when it cannot be
            # fetched or fails, the end of the log as before.
            # No server log means the server tests never ran (init, dependencies, install or build failed): that
            # sentence comes first, whatever the JavaScript suite, which still runs, says after it.
            before=""
            if [ ! -f "$RUNNER_TEMP/test-output.log" ]; then
              before="Échec AVANT les tests (init/dépendances/install/build) — lire le run."
            fi
            logs=("$RUNNER_TEMP/test-output.log")
            if [ "${{ inputs.pytest_blocking }}" = "true" ]; then
              logs+=("$RUNNER_TEMP/pytest-output.log")
            fi
            logs+=("$RUNNER_TEMP/js-test-output.log")
            first_log=""
            for f in "${logs[@]}"; do
              if [ -z "$first_log" ] && [ -f "$f" ]; then first_log="$f"; fi
            done
            if [ -n "$first_log" ]; then
              if curl -sfL --retry 2 --max-time 20 -o "$RUNNER_TEMP/ci_test_summary.py" \
                  https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/ci_test_summary.py; then
                SUMMARY=$(timeout 60 env -u CI_SECRET python3 -I "$RUNNER_TEMP/ci_test_summary.py" --limit 1400 "${logs[@]}" 2>/dev/null) || SUMMARY=""
              fi
              if [ -z "$SUMMARY" ] && [ -z "$before" ]; then
                SUMMARY=$(tail -c 1400 "$first_log")
              fi
            fi
            if [ -n "$before" ]; then
              if [ -n "$SUMMARY" ]; then SUMMARY="$before"$'\n'"$SUMMARY"; else SUMMARY="$before"; fi
            fi
          fi
          resp=$(curl -sS --max-time 20 -X POST \
            "https://neoservice.neoffice.me/api/method/neoffice_devops.github.ci.report" \
            --data-urlencode "secret=$CI_SECRET" \
            --data-urlencode "repo=${{ github.repository }}" \
            --data-urlencode "app=${{ inputs.app }}" \
            --data-urlencode "sha=${{ github.sha }}" \
            --data-urlencode "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-urlencode "conclusion=${{ job.status }}" \
            --data-urlencode "ref=${{ github.ref_name }}" \
            --data-urlencode "upstream=${{ inputs.upstream_preview }}" \
            --data-urlencode "summary=${SUMMARY}" 2>&1) || true
          echo "$resp"
          if ! printf '%s' "$resp" | python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin).get("message", {}).get("ok") else 1)' 2>/dev/null; then
            short=$(printf '%s' "$resp" | tr -d '\r\n' | cut -c1-200)
            echo "::warning title=CI report refused::the hub did not accept this run's report (${short:-no answer}): no tracker issue was opened or closed"
          fi

  # The same build + tests on OUR CI machine instead of GitHub's (decision of 2026-11-11, "Mac mini first": GitHub bills
  # a private repository's minutes, about 28 $ a working day, and a public repository runs free). It runs when the
  # caller's repository has the variable CI_RUNNER=neoffice-mini; without it nothing changes, `tests` above runs on
  # ubuntu-latest. Back to GitHub: `gh variable delete CI_RUNNER -R bvisible/<repo>`.
  # The machine: a Linux VM on the Mac mini (Ubuntu 24.04 arm64, 6 CPUs, 20 GiB), one runner per PRIVATE repository
  # (a runner of ours on a public one would run anyone's pull request: none is registered there, so a public caller
  # with the variable would only wait). No `services:`: MariaDB 10.6 and Redis are the machine's, and the job first
  # takes one of its three places (`ci-slot acquire`: three heavy suites at most at once, each with its own database,
  # its own two Redis and its own stub ports; the fourth waits). Same steps as `tests`, in the same order; what differs
  # says why. The machine is described in neoffice-devops, scripts/ci-mini/.
  tests-mini:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && vars.CI_RUNNER == 'neoffice-mini' }}
    runs-on: [self-hosted, linux, arm64, neoffice-mini]
    # Waiting for a place counts in a job's time: the ceiling is the wait (five hours at most: a wait that gives up
    # would report a red run that says nothing of the code) plus the suite, whose long steps keep their own ceiling.
    timeout-minutes: 360
    name: build + tests (${{ inputs.app }}, neoffice-mini)

    steps:
      - name: Take a place on the CI machine (three heavy suites at most at once)
        timeout-minutes: 305
        run: |
          ci-slot acquire
          echo "BENCH=$HOME/frappe-bench" >> "$GITHUB_ENV"

      - name: Clone app under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Test modules that break the run for everyone (static, seconds)
        run: |
          if curl -sfL -o /tmp/check_test_hygiene.py \
              https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/check_test_hygiene.py; then
            python3 /tmp/check_test_hygiene.py --root .
          else
            echo "::warning::the test hygiene check could not be fetched: skipped"
          fi

      - name: A new test does not act as Administrator (static, seconds)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) echo "no base to compare with: skipped"; exit 0 ;;
          esac
          if ! git fetch -q --depth=1 origin "$BASE" || ! git fetch -q --deepen=300 origin "$GITHUB_SHA"; then
            echo "::warning::the base $BASE could not be fetched: the role check is skipped"
            exit 0
          fi
          if curl -sfL -o /tmp/check_test_roles.py \
              https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/check_test_roles.py; then
            python3 /tmp/check_test_roles.py --root . --base "$BASE"
          else
            echo "::warning::the role check could not be fetched: skipped"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          check-latest: true

      # No `Cache pip`: the machine keeps its pip, uv and yarn caches on its own disk (and GitHub's cache would be
      # downloaded again at every job).

      - name: Retry helper (a registry that answers 5xx for a minute is not a verdict on our code)
        run: |
          if ! curl -sfL --retry 3 --retry-delay 5 -o ~/ci_retry.sh \
              https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/ci_retry.sh; then
            echo "::warning::the retry helper could not be fetched: the steps that download will run once"
            printf 'retry() { "$@"; }\n' > ~/ci_retry.sh
          fi

      - name: MariaDB client, Redis and wkhtmltopdf of the machine (installed once, nothing installed here)
        # The machine carries what the step `Install MariaDB client and wkhtmltopdf` installs on a GitHub runner:
        # MariaDB 10.6 (server and client), wkhtmltopdf 0.12.6.1 with patched Qt, the xfonts. This only says so.
        run: |
          mariadb --version
          redis-cli -p "$CI_REDIS_CACHE_PORT" ping
          redis-cli -p "$CI_REDIS_QUEUE_PORT" ping
          wkhtmltopdf --version

      - name: Init bench (bvisible/frappe version-15 — the fleet's frappe)
        timeout-minutes: ${{ inputs.tests_timeout_minutes }}
        run: |
          # shellcheck source=/dev/null
          . ~/ci_retry.sh
          # bench goes into a venv of this runner: setup-python's interpreter is shared by every runner of the machine.
          PYTHON="$pythonLocation/bin/python"
          "$PYTHON" -m venv ~/bench-cli
          retry ~/bench-cli/bin/pip install --quiet frappe-bench
          export PATH="$HOME/bench-cli/bin:$PATH"
          echo "$HOME/bench-cli/bin" >> "$GITHUB_PATH"
          FRAPPE_PATH=https://github.com/bvisible/frappe
          if [ "${{ inputs.upstream_preview }}" = "true" ]; then
            FRAPPE_PATH=https://github.com/frappe/frappe
            echo "UPSTREAM PREVIEW: frappe from $FRAPPE_PATH (erpnext from frappe/erpnext below)"
          fi
          init_bench() {
            rm -rf ~/frappe-bench
            bench init --skip-redis-config-generation --skip-assets \
              --frappe-path "$FRAPPE_PATH" \
              --frappe-branch version-15 \
              --python "$PYTHON" ~/frappe-bench
          }
          retry init_bench
          ~/frappe-bench/env/bin/pip install --quiet "setuptools<81"
          ~/frappe-bench/env/bin/python -c "import pkg_resources; print('pkg_resources OK')"
          # The place's two Redis and the machine's MariaDB (character set and collation set on the server, as
          # the SET GLOBAL of `tests` does on the service).
          ci-slot configure-bench ~/frappe-bench

      - name: Upstream preview — carry the tail our fork adds to frappe's tests
        if: ${{ inputs.upstream_preview == true }}
        env:
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.request

          FILES = ["frappe/tests/__init__.py", "frappe/tests/utils.py"]
          ADDED = ["frappe/tests/roles.py"]
          bench = os.path.expanduser("~/frappe-bench/apps/frappe")
          token = os.environ.get("FLEET_READ_TOKEN", "")

          def ours(rel):
              url = f"https://api.github.com/repos/bvisible/frappe/contents/{rel}?ref=version-15"
              headers = {"Accept": "application/vnd.github.raw"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(url, headers=headers)
              return urllib.request.urlopen(req, timeout=30).read().decode("utf-8")

          carried = 0
          for rel in FILES:
              target = os.path.join(bench, rel)
              theirs = open(target, encoding="utf-8").read()
              mine = ours(rel)
              base = theirs.rstrip()
              if not mine.startswith(base):
                  print(f"::warning::{rel}: our version is not upstream's plus a tail — "
                        "nothing carried, the errors below are real and need a look")
                  continue
              tail = mine[len(base):]
              if not tail.strip():
                  print(f"{rel}: no divergence to carry")
                  continue
              with open(target, "a", encoding="utf-8") as fh:
                  fh.write(tail)
              carried += len(tail)
              print(f"{rel}: carried {len(tail)} chars")
          for rel in ADDED:
              target = os.path.join(bench, rel)
              if os.path.exists(target):
                  print(f"::warning::{rel}: upstream has one now — not carried, look at both")
                  continue
              with open(target, "w", encoding="utf-8") as fh:
                  carried += fh.write(ours(rel))
              print(f"{rel}: carried whole")
          print(f"total carried onto upstream frappe: {carried} chars")
          PY

      - name: Get dependency apps
        if: inputs.install_apps != ''
        timeout-minutes: ${{ inputs.tests_timeout_minutes }}
        working-directory: ${{ env.BENCH }}
        run: |
          AUTH="https://github.com/"
          if [ -n "$FLEET_READ_TOKEN" ]; then
            AUTH="https://x-access-token:${FLEET_READ_TOKEN}@github.com/"
          fi
          # shellcheck source=/dev/null
          . ~/ci_retry.sh
          IFS=',' read -ra DEPS <<< "${{ inputs.install_apps }}"
          for dep in "${DEPS[@]}"; do
            dep="$(echo "$dep" | xargs)"
            [ -z "$dep" ] && continue
            if [ "${{ inputs.upstream_preview }}" = "true" ] && [ "$dep" = "erpnext" ]; then
              retry bench get-app erpnext https://github.com/frappe/erpnext --branch version-15 --overwrite
              continue
            fi
            get_dep() {
              bench get-app "$dep" "${AUTH}bvisible/${dep//_/-}" --branch version-15 --overwrite \
                || bench get-app "$dep" "${AUTH}bvisible/${dep}" --branch version-15 --overwrite
            }
            retry get_dep
          done
        env:
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}

      - name: Get app under test
        timeout-minutes: ${{ inputs.tests_timeout_minutes }}
        working-directory: ${{ env.BENCH }}
        run: |
          # shellcheck source=/dev/null
          . ~/ci_retry.sh
          get_app_under_test() {
            if [ "${{ inputs.skip_build }}" = "true" ]; then
              bench get-app --overwrite --skip-assets ${{ inputs.app }} "$GITHUB_WORKSPACE" && bench setup requirements --dev
            else
              bench get-app --overwrite ${{ inputs.app }} "$GITHUB_WORKSPACE" && bench setup requirements --dev
            fi
          }
          retry get_app_under_test
          retry ~/frappe-bench/env/bin/pip install --quiet pytest

      - name: New site + install
        timeout-minutes: ${{ inputs.tests_timeout_minutes }}
        working-directory: ${{ env.BENCH }}
        run: |
          # The database is this job's own (ci_s<place>_<run>_<attempt>): two jobs never share one. The MariaDB admin
          # login comes from the bench's configuration (ci-slot configure-bench), never from this file.
          bench new-site --db-name "$CI_DB_NAME" --db-root-username ci_admin --admin-password admin test_site
          bench --site test_site set-config auto_email_id test@example.com
          bench --site test_site set-config mail_server smtp.example.com
          bench --site test_site set-config mail_login test@example.com
          bench --site test_site set-config mail_password test
          bench --site test_site set-config throttle_user_limit 1000 --parse   # --parse: an int, not the string "1000"
          # PDF rendering resolves /assets URLs against host_name: the place's own port, served by the stub below.
          bench --site test_site set-config host_name "http://127.0.0.1:$CI_ASSET_PORT"
          if [[ ",${{ inputs.install_apps }}," == *,hrms,* || "${{ inputs.app }}" == "hrms" ]]; then
            bench --site test_site set-config user_type_doctype_limit '{"employee_self_service": 80}' --parse
          fi
          IFS=',' read -ra DEPS <<< "${{ inputs.install_apps }}"
          for dep in "${DEPS[@]}"; do
            dep="$(echo "$dep" | xargs)"
            [ -z "$dep" ] && continue
            bench --site test_site install-app "$dep"
          done
          bench --site test_site install-app ${{ inputs.app }}

      - name: Serve exchange rates locally (the tests never wait for a rate provider)
        # As in `tests`, on the place's own port instead of 8001.
        if: inputs.app == 'erpnext' || contains(inputs.install_apps, 'erpnext')
        working-directory: ${{ env.BENCH }}/sites
        run: |
          nohup python3 - >/dev/null 2>&1 <<'PY' &
          import http.server, json, os, socketserver, urllib.parse
          PER_USD = {"USD": 1.0, "EUR": 0.92, "CHF": 0.88, "GBP": 0.79, "INR": 83.0, "PKR": 280.0,
                     "JPY": 150.0, "CAD": 1.36, "AUD": 1.52, "CNY": 7.2, "SEK": 10.5, "NOK": 10.8, "DKK": 6.9}
          class H(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.0"
              def do_GET(self):
                  url = urllib.parse.urlsplit(self.path)
                  query = urllib.parse.parse_qs(url.query)
                  base = (query.get("base") or ["USD"])[0]
                  target = (query.get("symbols") or ["USD"])[0]
                  rate = round(PER_USD.get(target, 1.0) / PER_USD.get(base, 1.0), 6)
                  body = json.dumps({"amount": 1.0, "base": base, "date": url.path.strip("/"), "rates": {target: rate}}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          socketserver.TCPServer.allow_reuse_address = True
          socketserver.TCPServer(("127.0.0.1", int(os.environ["CI_RATES_PORT"])), H).serve_forever()
          PY
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null "http://127.0.0.1:$CI_RATES_PORT/2026-01-01?base=USD&symbols=INR" && break
            sleep 0.5
          done
          ../env/bin/python - <<'PY'
          import os
          import frappe
          frappe.init(site="test_site", sites_path=".")
          frappe.connect()
          frappe.set_user("Administrator")
          settings = frappe.get_single("Currency Exchange Settings")
          settings.service_provider = "Custom"
          settings.api_endpoint = "http://127.0.0.1:%s/{transaction_date}" % os.environ["CI_RATES_PORT"]
          settings.set("req_params", [{"key": "base", "value": "{from_currency}"}, {"key": "symbols", "value": "{to_currency}"}])
          settings.set("result_key", [{"key": "rates"}, {"key": "{to_currency}"}])
          settings.save()
          frappe.db.commit()
          from erpnext.setup.utils import get_exchange_rate
          rate = get_exchange_rate("USD", "INR")
          print("exchange rates served on 127.0.0.1:%s, USD to INR:" % os.environ["CI_RATES_PORT"], rate)
          assert abs(rate - 83.0) < 1e-6, rate
          PY

      - name: Bootstrap erpnext test data
        if: contains(inputs.install_apps, 'erpnext') && inputs.erpnext_bootstrap
        working-directory: ${{ env.BENCH }}
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site execute erpnext.setup.utils.before_tests

      - name: Build frappe assets (suites that render frappe web templates)
        if: inputs.build_frappe_assets
        timeout-minutes: ${{ inputs.tests_timeout_minutes }}
        working-directory: ${{ env.BENCH }}
        run: bench build --app frappe

      - name: Build (blocking — an app that does not build must not ship)
        if: inputs.skip_build != true
        timeout-minutes: ${{ inputs.tests_timeout_minutes }}
        working-directory: ${{ env.BENCH }}
        run: bench build --app ${{ inputs.app }}

      - name: Debug test records (test_args starts with --debug-records)
        if: startsWith(inputs.test_args, '--debug-records')
        working-directory: ${{ env.BENCH }}/sites
        env:
          DEBUG_SPEC: ${{ inputs.test_args }}
          APP_UNDER_TEST: ${{ inputs.app }}
        run: |
          ../env/bin/python <<'PY'
          import os
          import traceback

          import frappe
          import frappe.test_runner as tr

          frappe.init(site="test_site", sites_path=".")
          frappe.connect()
          frappe.flags.in_test = True

          spec = os.environ["DEBUG_SPEC"]
          target = spec.split(":", 1)[1] if ":" in spec else None

          orig = tr.make_test_objects

          def spy(doctype, test_records=None, verbose=None, reset=False, commit=False):
              recs = test_records if test_records is not None else frappe.get_test_records(doctype)
              print(">>>> make_test_objects %s (%d records)" % (doctype, len(recs or [])), flush=True)
              for r in recs or []:
                  keys = ("doctype", "item_code", "name", "variant_of", "has_variants", "item_name")
                  print("     rec:", {k: r.get(k) for k in keys if r.get(k) is not None}, flush=True)
              return orig(doctype, test_records=test_records, verbose=verbose, reset=reset, commit=commit)

          tr.make_test_objects = spy

          if target:
              doctypes = [target]
          else:
              mods = frappe.get_all("Module Def", {"app_name": os.environ["APP_UNDER_TEST"]}, pluck="name")
              doctypes = frappe.get_all(
                  "DocType", filters={"module": ["in", mods]}, pluck="name", order_by="name"
              )
          print("==== %d doctypes to walk" % len(doctypes), flush=True)
          for dt in doctypes:
              print("==== DT:", dt, flush=True)
              try:
                  tr.make_test_records(dt, verbose=1, commit=True)
                  tr.make_test_records_for_doctype(dt, verbose=1, commit=True)
              except Exception as exc:
                  print("!!!! FAILED at doctype:", dt, "->", type(exc).__name__, str(exc)[:300], flush=True)
                  traceback.print_exc()
                  break
          frappe.db.commit()
          PY

      - name: Serve host_name so wkhtmltopdf can fetch what a print format links
        # As in `tests`, on the place's own port instead of 8000.
        if: "!startsWith(inputs.test_args, '--debug-records')"
        run: |
          nohup python3 - >/dev/null 2>&1 <<'PY' &
          import http.server, os, socketserver
          class H(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.0"
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", "0")
                  self.end_headers()
              do_HEAD = do_GET
              def log_message(self, *a):
                  pass
          socketserver.TCPServer.allow_reuse_address = True
          socketserver.TCPServer(("127.0.0.1", int(os.environ["CI_ASSET_PORT"])), H).serve_forever()
          PY
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null "http://127.0.0.1:$CI_ASSET_PORT/ping" && break
            sleep 0.5
          done
          curl -sf -o /dev/null "http://127.0.0.1:$CI_ASSET_PORT/ping" && echo "asset stub up on 127.0.0.1:$CI_ASSET_PORT"

      - name: Run tests
        if: "!startsWith(inputs.test_args, '--debug-records') && !inputs.parallel_runner"
        timeout-minutes: ${{ inputs.tests_timeout_minutes }}
        working-directory: ${{ env.BENCH }}
        run: |
          bench --site test_site set-config allow_tests true
          set -o pipefail
          # The log goes to $RUNNER_TEMP, the runner's folder for this job's files (emptied before every job), next to
          # the logs of the JavaScript and pytest suites: the report step reads them all from there (#2635).
          bench --site test_site run-tests --app ${{ inputs.app }} ${{ inputs.test_args }} 2>&1 | tee "$RUNNER_TEMP/test-output.log"
        env:
          TYPE: server
          CI: "Yes"

      - name: Run tests (parallel runner, one chunk — per-file isolation)
        if: "!startsWith(inputs.test_args, '--debug-records') && inputs.parallel_runner"
        timeout-minutes: ${{ inputs.tests_timeout_minutes }}
        working-directory: ${{ env.BENCH }}
        run: |
          bench --site test_site set-config allow_tests true
          set -o pipefail
          bench --site test_site run-parallel-tests --app ${{ inputs.app }} \
            --total-builds 1 --build-number 1 2>&1 | tee "$RUNNER_TEMP/test-output.log"
        env:
          TYPE: server
          CI: "Yes"

      - name: Pytest (suites invisible to the frappe runner — blocking when pytest_blocking)
        if: inputs.pytest_paths != '' && !startsWith(inputs.test_args, '--debug-records')
        continue-on-error: ${{ !inputs.pytest_blocking }}
        working-directory: ${{ env.BENCH }}/sites
        run: |
          set -o pipefail
          ../env/bin/pip install --quiet pytest
          rc=0
          for p in ${{ inputs.pytest_paths }}; do
            echo "==== pytest $p"
            timeout 900 ../env/bin/python -m pytest "../apps/${{ inputs.app }}/$p" -q -p no:cacheprovider --tb=short 2>&1 | tee -a "$RUNNER_TEMP/pytest-output.log" | tail -80 || rc=1
          done
          exit $rc

      - name: JavaScript tests of the app (node --test, seconds)
        if: ${{ !cancelled() && !startsWith(inputs.test_args, '--debug-records') }}
        env:
          APP: ${{ inputs.app }}
        run: |
          shopt -s nullglob
          files=("$APP"/tests/js/*.test.js)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no JavaScript tests under $APP/tests/js"
            exit 0
          fi
          node --version
          # The log is read by the report below, which names the failing tests on the tracker issue (#2635).
          set -o pipefail
          node --test "${files[@]}" 2>&1 | tee "$RUNNER_TEMP/js-test-output.log"

      - name: Report to the fleet tracker (via the hub)
        if: (success() || failure()) && !startsWith(inputs.test_args, '--debug-records')
        env:
          CI_SECRET: ${{ secrets.CI_REPORT_SECRET }}
        run: |
          if [ -z "$CI_SECRET" ]; then
            echo "::warning title=CI report not sent::no CI_REPORT_SECRET on this repository (secrets: inherit in the caller?): this run opens and closes no tracker issue"
            exit 0
          fi
          SUMMARY=""
          if [ "${{ job.status }}" != "success" ]; then
            # What the tracker issue says: each suite's verdict and the failing tests by name, read from every log a
            # suite wrote (scripts/ci_test_summary.py, #2635). The end of the server log was the prints of the last
            # tests, written after unittest's verdict: on 2026-11-13 the theme's issue quoted test-site setup and no
            # failing test, and a red `node --test` reported the end of a green server suite. The script runs isolated
            # (-I) and without the report's secret in its environment. It never decides the report: when it cannot be
            # fetched or fails, the end of the log as before.
            # No server log means the server tests never ran (init, dependencies, install or build failed): that
            # sentence comes first, whatever the JavaScript suite, which still runs, says after it.
            before=""
            if [ ! -f "$RUNNER_TEMP/test-output.log" ]; then
              before="Échec AVANT les tests (init/dépendances/install/build) — lire le run."
            fi
            logs=("$RUNNER_TEMP/test-output.log")
            if [ "${{ inputs.pytest_blocking }}" = "true" ]; then
              logs+=("$RUNNER_TEMP/pytest-output.log")
            fi
            logs+=("$RUNNER_TEMP/js-test-output.log")
            first_log=""
            for f in "${logs[@]}"; do
              if [ -z "$first_log" ] && [ -f "$f" ]; then first_log="$f"; fi
            done
            if [ -n "$first_log" ]; then
              if curl -sfL --retry 2 --max-time 20 -o "$RUNNER_TEMP/ci_test_summary.py" \
                  https://raw.githubusercontent.com/bvisible/neoffice-ci/main/scripts/ci_test_summary.py; then
                SUMMARY=$(timeout 60 env -u CI_SECRET python3 -I "$RUNNER_TEMP/ci_test_summary.py" --limit 1400 "${logs[@]}" 2>/dev/null) || SUMMARY=""
              fi
              if [ -z "$SUMMARY" ] && [ -z "$before" ]; then
                SUMMARY=$(tail -c 1400 "$first_log")
              fi
            fi
            if [ -n "$before" ]; then
              if [ -n "$SUMMARY" ]; then SUMMARY="$before"$'\n'"$SUMMARY"; else SUMMARY="$before"; fi
            fi
          fi
          resp=$(curl -sS --max-time 20 -X POST \
            "https://neoservice.neoffice.me/api/method/neoffice_devops.github.ci.report" \
            --data-urlencode "secret=$CI_SECRET" \
            --data-urlencode "repo=${{ github.repository }}" \
            --data-urlencode "app=${{ inputs.app }}" \
            --data-urlencode "sha=${{ github.sha }}" \
            --data-urlencode "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-urlencode "conclusion=${{ job.status }}" \
            --data-urlencode "ref=${{ github.ref_name }}" \
            --data-urlencode "upstream=${{ inputs.upstream_preview }}" \
            --data-urlencode "summary=${SUMMARY}" 2>&1) || true
          echo "$resp"
          if ! printf '%s' "$resp" | python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin).get("message", {}).get("ok") else 1)' 2>/dev/null; then
            short=$(printf '%s' "$resp" | tr -d '\r\n' | cut -c1-200)
            echo "::warning title=CI report refused::the hub did not accept this run's report (${short:-no answer}): no tracker issue was opened or closed"
          fi

      - name: Free the place (database, bench and Redis of this job removed)
        if: always()
        run: ci-slot release
