name: Hotfix overlay (reusable)
# One fix laid on the base an instance already runs, built here and published as a TAG (neoffice-maintenance#3237).
#
# The commits of the fix are already on the deploy branch and tried on osiris. A client that runs a base far behind cannot take the
# branch in a wave (a head the canary never carried, a hub behind, a shop not played), so the fix is cherry-picked (-x) onto THAT
# base, the front end is rebuilt on it when the fix touches it, and the result is one commit that holds the fix and its build.
# It is published as `hotfix/<app>/<B7>-<n>`: a tag, never a branch (nothing merges, nothing is reviewed in a PR, nothing is edited).
#
# What the hub does with the tag is not decided here: it re-reads `git diff <base>..<tag>`, judges it against a white list, asks for
# a copy of the client's instance to be tried, and only then lays it (neoffice_devops/cloud/hotfix/). This workflow checks what only
# GitHub can: the commits are on the deploy branch, apply on the base, build the way the base built, and the specs of the front pass.
#
# Never a name of an instance, of a host or of a client comes in: the inputs are hashes and an opaque identifier, validated by
# scripts/hotfix_overlay.py, and none of them is written into a shell command (they travel in the environment).
#
# Two jobs, because building runs third-party code (`yarn install` lifecycle scripts, the bundler, the specs) and publishing needs a
# write token: `build` holds a READ token, checks nothing out with credentials and hands over a git bundle; `publish` holds the write token,
# runs no third-party code, checks the bundle against what `build` said and pushes ONE annotated tag. Both run the script of the neoffice-ci
# commit named by `ci_ref` (a hash the caller pins, with this workflow's own `uses: …@<hash>`), never a branch.
#
# What binds the tag to this run for the hub is the notice THIS RUN writes as a notice of its own job (tag, commit, identifier, run): the hub
# reads it from the run's annotations, and it believes the run only if the three files that ran (the caller, this workflow, the script) are
# versions it knows. The tag's own message and tagger are text its author writes. GitHub does not let the Actions app be the only creator of
# `hotfix/*` tags, so the ruleset of the app's repository only forbids MOVING one.
on:
  workflow_call:
    inputs:
      app:
        description: "Python package name of the app (the tag says it): pos_next"
        required: true
        type: string
      base:
        description: "Full hash of the commit the instance runs (the base the fix is laid on)"
        required: true
        type: string
      commits:
        description: "Full hashes of the commits of the fix, oldest first, separated by blanks (already on the deploy branch)"
        required: true
        type: string
      hotfix_id:
        description: "Opaque identifier of the overlay, HF-0001 (the hub's record; never a name of an instance)"
        required: true
        type: string
      ci_ref:
        description: "Full hash of the neoffice-ci commit this workflow and its script are at: the caller pins it, the script is run from it"
        required: true
        type: string
      branch:
        description: "The deploy branch the fix is already on"
        required: false
        type: string
        default: "version-15"
      front_sources:
        description: "Paths of the sources of the front end, one per line (a folder ends with a slash): the build runs only when the fix touches one"
        required: false
        type: string
        default: ""
      artifact_paths:
        description: "Everything the build writes and the repository commits, one per line (a folder ends with a slash); a fix commit may not write them"
        required: false
        type: string
        default: ""
      node_version:
        description: "Node version of the build, as the app's own build workflow sets it"
        required: false
        type: string
        default: "20"
      install_command:
        description: "Installs the front end's dependencies from its lock file, at the base"
        required: false
        type: string
        default: ""
      build_command:
        description: "Builds the front end and its copies; it reads BUILD_VERSION (a fixed version, so that the build does not hold the time)"
        required: false
        type: string
        default: ""
      specs_command:
        description: "Runs the specs of the front end (required when the fix touches the front end)"
        required: false
        type: string
        default: ""
    outputs:
      tag:
        description: "The tag that was published"
        value: ${{ jobs.publish.outputs.tag }}
      sha:
        description: "The commit the tag points to"
        value: ${{ jobs.publish.outputs.sha }}

permissions:
  contents: read

concurrency:
  # one overlay of an app at a time: two of them on the same base would race for the same rank
  group: hotfix-overlay-${{ inputs.app }}
  cancel-in-progress: false

env:
  APP: ${{ inputs.app }}
  BASE: ${{ inputs.base }}
  COMMITS: ${{ inputs.commits }}
  HOTFIX_ID: ${{ inputs.hotfix_id }}
  BRANCH: ${{ inputs.branch }}
  FRONT_SOURCES: ${{ inputs.front_sources }}
  ARTIFACT_PATHS: ${{ inputs.artifact_paths }}
  RUN_ID: ${{ github.run_id }}
  CI_REF: ${{ inputs.ci_ref }}

jobs:
  build:
    name: build the overlay (no write token)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tip: ${{ steps.tip.outputs.tip }}
    steps:
      - name: The pinned script is a full hash
        run: |
          case "$CI_REF" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error title=hotfix overlay refused (bad_input)::ci_ref is not a full hash"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: bvisible/neoffice-ci
          ref: ${{ inputs.ci_ref }}
          path: ci
          persist-credentials: false

      - name: The inputs are what they should be, and the commits are fit to be laid
        run: python3 ci/scripts/hotfix_overlay.py check

      - name: Does the fix touch the front end?
        id: touch
        run: python3 ci/scripts/hotfix_overlay.py touches

      - uses: actions/setup-node@v4
        if: ${{ steps.touch.outputs.front_touched == 'true' }}
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install the front end at the base
        if: ${{ steps.touch.outputs.front_touched == 'true' }}
        env:
          COMMAND: ${{ inputs.install_command }}
        run: |
          git checkout --quiet --detach "$BASE"
          test -n "$COMMAND" || { echo "::error::no install command for a fix that touches the front end"; exit 1; }
          bash -euo pipefail -c "$COMMAND"

      - name: The witness - the build of the base alone gives the files the base committed
        if: ${{ steps.touch.outputs.front_touched == 'true' }}
        env:
          COMMAND: ${{ inputs.build_command }}
          BUILD_VERSION: witness
        run: |
          test -n "$COMMAND" || { echo "::error::no build command for a fix that touches the front end"; exit 1; }
          # what the build writes is deleted first, so that nothing of an older build is counted as its own
          while IFS= read -r path; do [ -z "$path" ] || rm -rf -- "$path"; done <<< "$ARTIFACT_PATHS"
          bash -euo pipefail -c "$COMMAND"
          python3 ci/scripts/hotfix_overlay.py fileset > "$RUNNER_TEMP/built.txt"
          python3 ci/scripts/hotfix_overlay.py fileset --rev "$BASE" > "$RUNNER_TEMP/committed.txt"
          python3 ci/scripts/hotfix_overlay.py compare "$RUNNER_TEMP/built.txt" "$RUNNER_TEMP/committed.txt"
          # back to the base as it was committed
          git reset --hard --quiet "$BASE"
          while IFS= read -r path; do [ -z "$path" ] || git clean -fdxq -- "$path"; done <<< "$ARTIFACT_PATHS"

      - name: Lay the commits of the fix on the base
        run: |
          python3 ci/scripts/hotfix_overlay.py apply
          python3 ci/scripts/hotfix_overlay.py modes

      - name: The specs of the front end
        if: ${{ steps.touch.outputs.front_touched == 'true' }}
        env:
          COMMAND: ${{ inputs.specs_command }}
        run: |
          test -n "$COMMAND" || { echo "::error title=hotfix overlay refused (no_specs)::a fix that touches the front end is not built without its specs"; exit 1; }
          bash -euo pipefail -c "$COMMAND"

      - name: Build the front end on the base and the fix
        if: ${{ steps.touch.outputs.front_touched == 'true' }}
        env:
          COMMAND: ${{ inputs.build_command }}
        run: |
          BUILD_VERSION="$(python3 ci/scripts/hotfix_overlay.py build-version)"
          export BUILD_VERSION
          while IFS= read -r path; do [ -z "$path" ] || rm -rf -- "$path"; done <<< "$ARTIFACT_PATHS"
          bash -euo pipefail -c "$COMMAND"
          # one commit holds the fix's build: the files with a fingerprint, the page that names them, the worker and its copy
          while IFS= read -r path; do [ -z "$path" ] || git add -A -- "$path"; done <<< "$ARTIFACT_PATHS"
          if git diff --cached --quiet; then
            echo "::error title=hotfix overlay refused (build_unchanged)::the build of a fix that touches the front end changed nothing"
            exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --no-verify -m "[hotfix] frontend artifacts of ${HOTFIX_ID}"
          python3 ci/scripts/hotfix_overlay.py modes

      - name: Hand over the overlay as a bundle
        id: tip
        run: |
          tip="$(git rev-parse HEAD)"
          git bundle create "$RUNNER_TEMP/overlay.bundle" HEAD "^$BASE"
          echo "tip=$tip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: overlay-bundle
          path: ${{ runner.temp }}/overlay.bundle
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish the tag (no third-party code)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: bvisible/neoffice-ci
          ref: ${{ inputs.ci_ref }}
          path: ci
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: overlay-bundle
          path: ${{ runner.temp }}

      - name: The inputs again, and the commits (the deploy branch may have moved)
        run: python3 ci/scripts/hotfix_overlay.py check

      - name: Publish the tag
        id: publish
        env:
          BUILT_TIP: ${{ needs.build.outputs.tip }}
        run: |
          # the commit the build job built is the commit of the bundle, and nothing else: it is checked, never assumed
          git fetch --quiet "$RUNNER_TEMP/overlay.bundle" "HEAD:refs/hotfix-overlay/tip"
          tip="$(git rev-parse refs/hotfix-overlay/tip)"
          test "$tip" = "$BUILT_TIP" || { echo "::error title=hotfix overlay refused (bundle)::the bundle is not the commit the build said"; exit 1; }
          git merge-base --is-ancestor "$BASE" "$tip" || { echo "::error title=hotfix overlay refused (bundle)::the bundle is not on the base"; exit 1; }
          tag="$(python3 ci/scripts/hotfix_overlay.py next-tag)"
          line="$(python3 ci/scripts/hotfix_overlay.py notice --tag "$tag" --sha "$tip")"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$tag" -m "$line" "$tip"
          # never forced: a tag that exists is a rank that was taken
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
          echo "::notice title=hotfix overlay::$line"
          {
            echo "### Hotfix overlay ${HOTFIX_ID}"
            echo "- tag \`$tag\` -> \`$tip\`"
          } >> "$GITHUB_STEP_SUMMARY"
