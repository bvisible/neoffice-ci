- id: check-test-roles
  name: a new test does not act as Administrator
  description: A new test that creates or submits a business document as Administrator proves nothing about a real user.
  entry: scripts/check_test_roles.py --base HEAD
  language: script
  files: (^|/)test_[^/]*\.py$
  types: [python]
- id: check-whitelist-permissions
  name: a new web method asks for a right
  description: A new or changed @frappe.whitelist method holds a permission check, or says why it needs none.
  entry: scripts/check_whitelist_permissions.py --base HEAD
  language: script
  types: [python]
- id: check-dialogs
  name: a new window follows the desk's model
  description: A new or touched frappe.ui.Dialog declares its size and names its action by a verb; no veil or width made by hand (design system 6.18).
  entry: scripts/check_dialogs.py --base HEAD
  language: script
  files: \.(js|ts|jsx|tsx|vue|html|css|scss)$
- id: check-word-lists
  name: no list of words decides in the assistant's place
  description: In the paths a repository declares in .decision-paths.json, every list of everyday words is gone or declared with its reason and who accepted it.
  entry: scripts/check_word_lists.py
  language: script
  files: (\.(py|js)$|^\.decision-paths\.json$)
- id: check-key-line
  name: a commit that touches a decision path names its site key
  description: A commit that touches a path declared in .decision-paths.json holds a line "Key:" naming the site key that guards the change, or says why there is none and who reviewed it.
  entry: scripts/check_key_line.py --message
  language: script
  stages: [commit-msg]
