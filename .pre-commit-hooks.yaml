- id: check-test-roles
  name: a new test does not act as Administrator
  description: A new test that creates or submits a business document as Administrator proves nothing about a real user.
  entry: scripts/check_test_roles.py --base HEAD
  language: script
  files: (^|/)test_[^/]*\.py$
  types: [python]
- id: check-whitelist-permissions
  name: a new web method asks for a right
  description: A new or changed @frappe.whitelist method holds a permission check, or says why it needs none.
  entry: scripts/check_whitelist_permissions.py --base HEAD
  language: script
  types: [python]
